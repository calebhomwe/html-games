<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Run</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% -10%,#0e7490,#0f0f23 55%,#07070f);display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.back{position:fixed;top:12px;left:14px;color:#cbd5e1;text-decoration:none;font-size:15px;font-weight:800;z-index:40}
#muteBtn{position:fixed;top:10px;right:12px;z-index:40;background:#1e293b;border:none;color:#fff;font-size:20px;width:48px;height:48px;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#stage{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
.top{text-align:center;padding:38px 10px 4px}
.top h1{font-size:clamp(18px,5vw,26px);font-weight:900;letter-spacing:-.5px;background:linear-gradient(90deg,#22d3ee,#4ade80,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}
#problem{font-size:clamp(30px,8vw,48px);font-weight:900;letter-spacing:1px;text-shadow:0 0 24px rgba(34,211,238,.55);margin-top:4px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-weight:800;font-size:14px}
.hud span{background:#1e293b;padding:7px 14px;border-radius:12px}
#lives{color:#f87171;letter-spacing:2px}
.ops{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.op{width:58px;height:58px;border-radius:16px;border:2px solid #334155;background:#1e293b;color:#fff;font-size:26px;font-weight:900;cursor:pointer}
.op.on{border-color:#4ade80;background:#14532d;box-shadow:0 0 16px rgba(74,222,128,.5)}
#msg{min-height:22px;text-align:center;font-weight:900;font-size:16px;margin-top:4px;opacity:0;transition:opacity .25s}
#msg.show{opacity:1}
#game{flex:1;width:100%;min-height:0;display:block}
.popup{position:fixed;font-weight:900;font-size:24px;pointer-events:none;z-index:50;text-shadow:0 2px 6px rgba(0,0,0,.7);animation:popup .7s ease forwards}
@keyframes popup{0%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -52px}}
#flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none;z-index:45}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(7,7,15,.86);backdrop-filter:blur(6px);z-index:60;text-align:center;padding:20px}
.ov h1{font-size:38px;font-weight:900}
.ov p{color:#cbd5e1;font-size:15px;line-height:1.6;max-width:420px}
.diff{display:flex;gap:10px}
.diff button{min-height:50px;padding:0 22px;border-radius:14px;border:2px solid #334155;background:#1e293b;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.diff button.on{border-color:#38bdf8;background:#0c4a6e;box-shadow:0 0 16px rgba(56,189,248,.5)}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#22d3ee,#4ade80);color:#04240f;font-size:22px;font-weight:900;padding:16px 48px;border-radius:999px;box-shadow:0 8px 26px rgba(34,211,238,.4);min-height:56px}
.btn:active{transform:scale(.94)}
.best{color:#4ade80;font-weight:800}
.hidden{display:none!important}
#count{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:#facc15;text-shadow:0 0 44px rgba(250,204,21,.85);opacity:0;pointer-events:none;z-index:65}
#count.show{opacity:1;animation:countpop .62s ease}
@keyframes countpop{0%{scale:1.7;opacity:0}30%{opacity:1}100%{scale:1;opacity:1}}
@media (max-height:430px){.ov{gap:8px;padding:10px}.ov h1{font-size:26px}.ov p{font-size:13px;line-height:1.35}.op{width:46px;height:46px;font-size:20px;border-radius:12px}.diff button{min-height:40px;padding:0 16px;font-size:14px}.btn{min-height:44px;padding:10px 36px;font-size:18px}.top{padding-top:30px}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button id="muteBtn">🔊</button>
<div id="stage">
  <div class="top">
    <h1>🏃 MATH RUN</h1>
    <div id="problem">3 × 4 = ?</div>
    <div class="hud">
      <span>Score <b id="score">0</b></span>
      <span>Streak <b id="combo">×1</b></span>
      <span id="lives">❤️❤️❤️</span>
      <span>Speed <b id="speedEl">1.0</b></span>
    </div>
    <div id="msg"></div>
  </div>
  <canvas id="game"></canvas>
</div>
<div id="flash"></div>
<div id="count"></div>
<div class="ov" id="start">
  <h1>🏃 Math Run</h1>
  <p>Swipe or tap a lane to run through the <b>correct answer</b> gate!<br>Wrong gate = lose a ❤️. You have 3!</p>
  <div class="ops" id="ops"></div>
  <div class="diff" id="diff"></div>
  <button class="btn" id="playBtn">▶ Start</button>
</div>
<div class="ov hidden" id="over">
  <h1>💥 Crashed!</h1>
  <div style="font-size:15px;color:#94a3b8" id="finCheer">Great run!</div>
  <div style="font-size:20px">Score: <b id="finScore">0</b></div>
  <div style="font-size:16px">Best: <b class="best" id="finBest">0</b></div>
  <button class="btn" id="againBtn">Play Again</button>
</div>
<script>
const DIFF={easy:{add:[1,9],sub:[2,9],mul:[2,5],div:[2,5],sp:.26},medium:{add:[4,20],sub:[4,20],mul:[3,9],div:[3,9],sp:.34},hard:{add:[10,50],sub:[10,50],mul:[6,12],div:[6,12],sp:.44}};
const GATE_H=70,GATE_COLORS=['#22d3ee','#4ade80','#f472b6'];
let difficulty='easy',state='ready',score=0,best=+localStorage.getItem('mathRunBest')||0,combo=0,lives=3,playerLane=1,spawnCd=0,shakeT=0,lastTs=0;
let selected={'+':true,'-':true,'×':true,'÷':true};
const parts=[];
const row={y:0,correctLane:0,values:[0,0,0],evaluated:false,active:false};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const problemEl=document.getElementById('problem'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),livesEl=document.getElementById('lives'),speedEl=document.getElementById('speedEl'),flash=document.getElementById('flash');
let W=0,H=0,DPR=1;
let canvasRect={left:0,top:0},gateSprites=null;
const MAX_PARTS=140;
const popupPool=[];

let AC,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
function snd(n){if(!AC||muted)return;if(n==='pass'){tone(700,.07,'triangle',.18);tone(1000,.09,'triangle',.15);}else if(n==='crash'){tone(140,.35,'sawtooth',.25);tone(60,.5,'sawtooth',.22);}else if(n==='end'){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.18),i*140));}else if(n==='tick'){tone(760,.06,'square',.13);}else if(n==='go'){tone(1200,.18,'triangle',.22);}}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function genProblem(){
  const ops=['+','-','×','÷'].filter(o=>selected[o]);
  if(!ops.length){selected['+']=true;ops.push('+');}
  const op=ops[rnd(0,ops.length-1)],lv=DIFF[difficulty];
  let a,b,ans,sym;
  if(op==='+'){a=rnd(lv.add[0],lv.add[1]);b=rnd(lv.add[0],lv.add[1]);ans=a+b;sym='+';}
  else if(op==='-'){a=rnd(lv.sub[0],lv.sub[1]);b=rnd(0,a);ans=a-b;sym='−';}
  else if(op==='×'){a=rnd(lv.mul[0],lv.mul[1]);b=rnd(lv.mul[0],lv.mul[1]);ans=a*b;sym='×';}
  else{b=rnd(lv.div[0],lv.div[1]);const q=rnd(lv.div[0],lv.div[1]);a=b*q;ans=q;sym='÷';}
  return {text:a+' '+sym+' '+b,ans};
}
function genOptions(ans,n){
  const set=new Set([ans]);let guard=0;
  const spread=Math.max(3,Math.round(Math.abs(ans)*0.25)+2);
  while(set.size<n&&guard++<300){const d=rnd(1,spread);let v=ans+(Math.random()<.5?-d:d);if(v<0)v=ans+d;set.add(v);}
  for(let v=ans+1;set.size<n;v++)set.add(v);
  const arr=[...set];
  for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function spawnRow(){
  const p=genProblem();
  const opts=genOptions(p.ans,3).filter(v=>v!==p.ans);
  const correctLane=rnd(0,2);
  let j=0;
  for(let i=0;i<3;i++)row.values[i]=(i===correctLane)?p.ans:opts[j++];
  row.y=-GATE_H;row.correctLane=correctLane;row.evaluated=false;row.active=true;
  problemEl.textContent=p.text+' = ?';
}
function laneCenter(i){return W/6+i*W/3;}
function speed(){const b=H*DIFF[difficulty].sp;return b*(1+Math.min(score*0.04,1));}
function playerY(){return H-130;}
function resize(){
  const r=canvas.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  canvasRect=r;
  buildGateSprites();
}
function buildGateSprites(){
  if(W<=0)return;
  gateSprites=[];
  const laneW=W/3,gw=laneW-16;
  for(let i=0;i<3;i++){
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.ceil(gw*DPR));c.height=Math.ceil(GATE_H*DPR);
    const x=c.getContext('2d');x.scale(DPR,DPR);
    const g=x.createLinearGradient(0,0,0,GATE_H);
    g.addColorStop(0,GATE_COLORS[i]);g.addColorStop(1,GATE_COLORS[i]+'55');
    x.fillStyle=g;
    x.beginPath();x.moveTo(14,0);x.arcTo(gw,0,gw,GATE_H,14);x.arcTo(gw,GATE_H,0,GATE_H,14);x.arcTo(0,GATE_H,0,0,14);x.arcTo(0,0,gw,0,14);x.closePath();x.fill();
    gateSprites.push(c);
  }
}
function move(dir){
  if(state!=='play')return;
  const nl=playerLane+dir;
  if(nl<0||nl>2)return;
  playerLane=nl;initAudio();tone(500,.06,'square',.08);
}
function spawnParticles(x,y,n){
  for(let i=0;i<n;i++){
    let p;
    if(parts.length<MAX_PARTS){p={x:0,y:0,vx:0,vy:0,life:0,color:'#fff',r:2};parts.push(p);}
    else{p=parts[(Math.random()*parts.length)|0];}
    p.x=x;p.y=y;p.vx=(Math.random()-.5)*360;p.vy=(Math.random()-.5)*360-120;p.life=1;p.color=['#f87171','#facc15','#fff'][rnd(0,2)];p.r=rnd(2,6);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(shakeT>0)ctx.translate((Math.random()-.5)*shakeT*16,(Math.random()-.5)*shakeT*16);
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=2;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(W/3*i,0);ctx.lineTo(W/3*i,H);ctx.stroke();}
  const sp=speed(),now=Date.now();
  for(let i=0;i<12;i++){const y=((i*60-(now*sp/1000)%720))%H;ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,(y%H+H)%H,W,3);}
  if(row.active){
    const laneW=W/3;
    for(let i=0;i<3;i++){
      const x=i*laneW+8,gw=laneW-16;
      if(gateSprites&&gateSprites[i])ctx.drawImage(gateSprites[i],x,row.y,gw,GATE_H);
      ctx.fillStyle='#0f172a';ctx.font='900 26px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(row.values[i],x+gw/2,row.y+GATE_H/2);
    }
  }
  const px=laneCenter(playerLane),py=playerY();
  ctx.font='44px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🏃',px,py);
  ctx.beginPath();ctx.arc(px,py+30,26,0,7);ctx.fillStyle='rgba(34,211,238,.25)';ctx.fill();
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(p.life<=0)continue;p.life-=.03;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=6;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.fill();ctx.globalAlpha=1;}
  if(shakeT>0)ctx.setTransform(DPR,0,0,DPR,0,0);
}
function updateHUD(){scoreEl.textContent=score;comboEl.textContent='×'+Math.max(1,combo);livesEl.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));speedEl.textContent=H>0?(speed()/(H*DIFF[difficulty].sp)).toFixed(1):'1.0';}
const msgEl=document.getElementById('msg');let msgT=0;
const CHEER=['Nice! 🎯','Great job! 🌟','Awesome! 🚀','Super! ⚡','Amazing! 🎉','Keep going! 🔥'];
const TRY=['Almost! 💪','Try again! 🙌','You can do it! 🌈','So close! ✨'];
function say(txt,color){msgEl.textContent=txt;msgEl.style.color=color||'#4ade80';msgEl.classList.remove('show');void msgEl.offsetWidth;msgEl.classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>msgEl.classList.remove('show'),1200);}
function popup(txt,x,y,color){
  let p=popupPool.pop();
  if(!p){p=document.createElement('div');p.className='popup';}
  p.textContent=txt;
  p.style.left=(x-20)+'px';p.style.top=(y-10)+'px';p.style.color=color;
  if(!p.parentNode)document.body.appendChild(p);
  p.style.animation='none';void p.offsetWidth;p.style.animation='';
  setTimeout(()=>{if(p.parentNode)p.parentNode.removeChild(p);popupPool.push(p);},700);
}
function loseLife(){
  lives--;combo=0;shakeT=1;snd('crash');updateHUD();
  spawnParticles(laneCenter(playerLane),playerY(),20);
  flash.style.opacity='.45';setTimeout(()=>flash.style.opacity='0',120);
  if(lives<=0){gameOver();return;}
  say('It was '+row.values[row.correctLane]+' · '+TRY[rnd(0,TRY.length-1)],'#fca5a5');
  row.active=false;spawnCd=0.9;
}
function gameOver(){
  state='over';
  document.getElementById('finCheer').textContent=TRY[rnd(0,TRY.length-1)];
  if(score>best){best=score;localStorage.setItem('mathRunBest',best);}
  document.getElementById('finScore').textContent=score;
  document.getElementById('finBest').textContent=best;
  setTimeout(()=>document.getElementById('over').classList.remove('hidden'),650);
}
function loop(ts){
  requestAnimationFrame(loop);
  if(state==='play'){
    const dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;
    if(shakeT>0)shakeT-=dt*2;
    if(!row.active){
      if(spawnCd>0)spawnCd-=dt;else spawnRow();
    }else{
      row.y+=speed()*dt;
      if(!row.evaluated&&row.y+GATE_H>playerY()){
        row.evaluated=true;
        if(playerLane===row.correctLane){
          score++;combo++;snd('pass');spawnCd=0.6;
          popup('+1',laneCenter(playerLane)+canvasRect.left,playerY()+canvasRect.top,'#4ade80');
          if(combo%5===0){say(CHEER[rnd(0,CHEER.length-1)]);popup('⚡ COMBO ×'+combo,laneCenter(playerLane)+canvasRect.left,playerY()+canvasRect.top-46,'#facc15');}
          updateHUD();
        }else{loseLife();}
      }
      if(row.active&&row.y>H+40)row.active=false;
    }
  }
  draw();
}
function startGame(){
  score=0;combo=0;lives=3;playerLane=1;row.active=false;spawnCd=0.4;shakeT=0;lastTs=0;parts.length=0;
  updateHUD();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  state='play';
}
let sx=0;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;});
canvas.addEventListener('pointerup',e=>{
  initAudio();
  const dx=e.clientX-sx;
  if(dx>30)move(1);
  else if(dx<-30)move(-1);
  else{
    const x=e.clientX-canvasRect.left;
    const lane=Math.min(2,Math.max(0,Math.floor(x/(W/3))));
    if(lane!==playerLane){playerLane=lane;initAudio();tone(500,.06,'square',.08);}
  }
});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&Math.abs(e.clientX-sx)>40){move(e.clientX>sx?1:-1);sx=e.clientX;}});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  if(e.key==='ArrowRight'||e.key==='d')move(1);
});
document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';});
document.getElementById('playBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();startGame();});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});
const opsBox=document.getElementById('ops');
['+','-','×','÷'].forEach(o=>{const b=document.createElement('button');b.className='op on';b.textContent=o;b.addEventListener('pointerdown',e=>{e.stopPropagation();selected[o]=!selected[o];b.classList.toggle('on',selected[o]);if(!Object.keys(selected).some(k=>selected[k])){selected[o]=true;b.classList.add('on');}});opsBox.appendChild(b);});
const diffBox=document.getElementById('diff');
[['easy','Easy'],['medium','Medium'],['hard','Hard']].forEach(d=>{const b=document.createElement('button');b.textContent=d[1];if(d[0]==='easy')b.classList.add('on');b.addEventListener('pointerdown',e=>{e.stopPropagation();difficulty=d[0];[...diffBox.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');});diffBox.appendChild(b);});
window.addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
