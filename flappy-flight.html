<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Flight</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% -20%,#312e81,#0f0f23 60%,#07070f);display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none}
.back{position:fixed;top:12px;left:14px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:800;z-index:10}
.hud{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:36px;font-weight:900;z-index:5;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.hud.pop{animation:pop .22s ease-out}
.nb{color:#facc15;font-size:14px;font-weight:900;letter-spacing:2px}
.wrap{position:relative}
canvas{display:block;max-width:100vw;max-height:100dvh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);touch-action:none}
.mute{position:fixed;top:12px;right:14px;z-index:10;width:44px;height:44px;border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.74);backdrop-filter:blur(4px);border-radius:14px;z-index:6;text-align:center}
.ov h1{font-size:46px;font-weight:900;color:#fff;letter-spacing:-1px}
.ov h1 span{color:#facc15}
.ov .sub{color:#cbd5e1;font-size:15px;line-height:1.5;padding:0 26px}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#facc15,#fb923c);color:#1c1917;font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;box-shadow:0 8px 24px rgba(250,204,21,.35)}
.btn:active{transform:scale(.94)}
.stat{color:#e2e8f0;font-size:17px;font-weight:700}
.best{color:#4ade80;font-weight:800}
.medal{font-size:58px}
.hidden{display:none}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button class="mute" id="muteBtn">🔊</button>
<div class="wrap">
  <div class="hud" id="hud">0</div>
  <canvas id="cv" width="420" height="700"></canvas>
  <div class="ov" id="start">
    <h1>Flappy <span>Flight</span></h1>
    <div class="sub">Tap or press Space to flap. Fly through the pipes without crashing!</div>
    <button class="btn" id="playBtn">▶ Play</button>
    <div class="stat">Best: <span class="best" id="startBest">0</span></div>
  </div>
  <div class="ov hidden" id="over">
    <h1>Game Over</h1>
    <div class="medal" id="medal">🥉</div>
    <div class="stat">Score: <b id="finScore">0</b></div>
    <div class="stat">Best: <b class="best" id="finBest">0</b></div>
    <div class="nb hidden" id="newBest">★ NEW BEST ★</div>
    <button class="btn" id="againBtn">Play Again</button>
  </div>
  <div class="ov hidden" id="pause">
    <h1>Paused</h1>
    <div class="sub">Tap or press P to resume</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=420,H=700,GROUND=655,GAP=175,PW=76;
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
const skyG=ctx.createLinearGradient(0,0,0,H);skyG.addColorStop(0,'#4aa8ff');skyG.addColorStop(1,'#c9ecff');
function rd(k){const v=+localStorage.getItem(k);return Number.isFinite(v)&&v>0?v:0;}
let state='ready',score=0,best=rd('flappyBest'),t=0,shake=0,groundX=0,dirty=true;
function spd(){return 175+Math.min(score*3,85);}
let bird={x:120,y:H/2,vy:0,r:15};
let pipes=[],clouds=[];
const parts=[],texts=[],MAXP=200,MAXT=32;
function spawnPart(x,y,vx,vy,c){let p=null;
for(let i=0;i<parts.length;i++){if(parts[i].life<=0){p=parts[i];break;}}
if(!p){if(parts.length>=MAXP)return;p={};parts.push(p);}
p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=1;p.c=c;}
function spawnText(x,y,txt,c){let x2=null;
for(let i=0;i<texts.length;i++){if(texts[i].life<=0){x2=texts[i];break;}}
if(!x2){if(texts.length>=MAXT)return;x2={};texts.push(x2);}
x2.x=x;x2.y=y;x2.txt=txt;x2.c=c||'#fff';x2.life=1;}
function fxAlive(a){for(let i=0;i<a.length;i++)if(a[i].life>0)return true;return false;}
let muted=localStorage.getItem('flappyMute')==='1';
document.getElementById('startBest').textContent=best;
for(let i=0;i<5;i++){const c={x:Math.random()*W,y:40+Math.random()*260,s:22+Math.random()*42,v:12+Math.random()*16};clouds.push(c);}
const hills=[];for(let i=0;i<7;i++)hills.push({x:i*80+Math.random()*50,w:70+Math.random()*60,h:28+Math.random()*50,l:0});for(let i=0;i<5;i++)hills.push({x:i*120+Math.random()*70,w:100+Math.random()*80,h:48+Math.random()*66,l:1});
let AC;
function initAudio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.resume)AC.resume();}
function tone(f,d,type,v,dl){if(!AC)return;const t0=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.18,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
function snd(n){if(!AC||muted)return;if(n==='flap')tone(520,.1,'triangle',.14);if(n==='score'){tone(988,.09,'sine',.18);tone(1319,.14,'sine',.18,.07);}if(n==='near')tone(1500,.08,'sine',.1);if(n==='mile'){tone(660,.09,'triangle',.16);tone(880,.09,'triangle',.16,.08);tone(1100,.14,'triangle',.16,.16);}if(n==='die'){tone(300,.25,'sawtooth',.2);tone(150,.35,'sawtooth',.2);}}
function ftext(x,y,txt,c){spawnText(x,y,txt,c);}
function burst(x,y,n,c){for(let i=0;i<n;i++){const an=Math.random()*Math.PI*2,sp=60+Math.random()*200;spawnPart(x,y,Math.cos(an)*sp,Math.sin(an)*sp,c);}}
function refreshMute(){document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();initAudio();muted=!muted;localStorage.setItem('flappyMute',muted?'1':'0');refreshMute();});
refreshMute();
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function flap(){bird.vy=-430;snd('flap');burst(bird.x-14,bird.y+10,4,'#ffffff');}
function startGame(){state='play';score=0;pipes=[];for(const p of parts)p.life=0;for(const x of texts)x.life=0;bird={x:120,y:H/2,vy:0,r:15};updateHud();}
function updateHud(){const h=document.getElementById('hud');h.textContent=score;h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');}
function die(){if(state!=='play')return;state='over';snd('die');shake=14;burst(bird.x,bird.y,26,'#fb923c');
const nb=score>best;if(nb){best=score;localStorage.setItem('flappyBest',best);}
document.getElementById('finScore').textContent=score;document.getElementById('finBest').textContent=best;
document.getElementById('newBest').classList[nb?'remove':'add']('hidden');
document.getElementById('medal').textContent=score>=30?'🏆':score>=15?'🥇':score>=8?'🥈':'🥉';
setTimeout(()=>document.getElementById('over').classList.remove('hidden'),450);}
function hitPipe(p){const r=bird.r-2;
if(bird.x+r>p.x&&bird.x-r<p.x+PW){if(bird.y-r<p.y-GAP/2||bird.y+r>p.y+GAP/2)return true;}
return false;}
function update(dt){
 t+=dt;if(shake>0)shake-=dt*30;
for(let i=0;i<parts.length;i++){const p=parts[i];if(p.life<=0)continue;p.life-=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}
for(let i=0;i<texts.length;i++){const x=texts[i];if(x.life<=0)continue;x.life-=dt*1.1;x.y-=42*dt;}
for(const c of clouds){c.x-=c.v*dt;if(c.x<-c.s*2)c.x=W+c.s;}
const hs=(state==='play'?spd():175)*dt;
for(const hl of hills){hl.x-=hs*(hl.l?.5:.25);if(hl.x<-hl.w)hl.x=W+hl.w;}
if(state==='play'){
groundX+=spd()*dt;
bird.vy+=1500*dt;bird.y+=bird.vy*dt;
if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0;}
if(bird.y+bird.r>GROUND)die();
if(!pipes.length||pipes[pipes.length-1].x<W-265)pipes.push({x:W+12,y:170+Math.random()*(GROUND-120-GAP-170),passed:false});
for(const p of pipes)p.x-=spd()*dt;
let wI=0;for(let i=0;i<pipes.length;i++){if(pipes[i].x>-PW-20)pipes[wI++]=pipes[i];}pipes.length=wI;
for(const p of pipes){
if(!p.passed&&p.x+PW<bird.x-bird.r){p.passed=true;score++;updateHud();snd('score');burst(bird.x,bird.y,8,'#facc15');
const cl=Math.min(bird.y-(p.y-GAP/2),(p.y+GAP/2)-bird.y)-bird.r;
if(cl<22){ftext(bird.x+34,bird.y-26,'Close!','#fbbf24');snd('near');}
if(score%10===0){ftext(W/2,190,score+' streak!','#4ade80');snd('mile');}}
if(hitPipe(p))die();
}
}else if(state==='over'){
bird.vy+=1500*dt;bird.y+=bird.vy*dt;
if(bird.y+bird.r>GROUND){bird.y=GROUND-bird.r;bird.vy=0;}
}
}
function draw(){
ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(W-70,90,34,0,7);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(W-70,90,50,0,7);ctx.fill();
for(const c of clouds){
ctx.fillStyle='rgba(255,255,255,.85)';
ctx.beginPath();ctx.ellipse(c.x,c.y,c.s,c.s*.55,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(c.x-c.s*.5,c.y+c.s*.18,c.s*.6,c.s*.4,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(c.x+c.s*.5,c.y+c.s*.15,c.s*.55,c.s*.38,0,0,7);ctx.fill();
}
for(const hl of hills){ctx.fillStyle=hl.l?'rgba(56,189,248,.38)':'rgba(125,211,252,.45)';ctx.beginPath();ctx.ellipse(hl.x,GROUND+8,hl.w,hl.h,0,Math.PI,Math.PI*2);ctx.fill();}
for(const p of pipes){
ctx.fillStyle='#22c55e';ctx.fillRect(p.x,0,PW,p.y-GAP/2);ctx.fillRect(p.x,p.y+GAP/2,PW,H-(p.y+GAP/2));
ctx.fillStyle='#16a34a';rr(p.x-5,p.y-GAP/2-26,PW+10,26,6);ctx.fill();rr(p.x-5,p.y+GAP/2,PW+10,26,6);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(p.x+10,0,6,p.y-GAP/2);ctx.fillRect(p.x+10,p.y+GAP/2,6,H);
}
ctx.fillStyle='#65a30d';ctx.fillRect(0,GROUND,W,H-GROUND);
ctx.fillStyle='#4d7c0f';ctx.fillRect(0,GROUND,W,8);
ctx.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<8;i++){const sx=((i*70-(groundX*0.5))%(W+70)+W+70)%(W+70)-70;ctx.fillRect(sx,GROUND+20,34,8);}
drawBird();
for(let i=0;i<parts.length;i++){const p=parts[i];if(p.life<=0)continue;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}
ctx.globalAlpha=1;
ctx.font='900 20px system-ui,sans-serif';ctx.textAlign='center';
for(let i=0;i<texts.length;i++){const x=texts[i];if(x.life<=0)continue;ctx.globalAlpha=Math.max(x.life,0);ctx.fillStyle=x.c;ctx.fillText(x.txt,x.x,x.y);}
ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawBird(){
const b=bird;let ang;
if(state==='ready')ang=Math.sin(t*4)*.12;else ang=Math.max(-.55,Math.min(1.15,b.vy*.002));
ctx.save();ctx.translate(b.x,b.y+(state==='ready'?Math.sin(t*3)*6:0));ctx.rotate(ang);
ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.ellipse(-4,0,9,7+Math.sin(t*18)*3.4,0,0,7);ctx.fill();
ctx.fillStyle='#facc15';ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,7);ctx.fill();
ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.ellipse(-2,5,9,5.5,0,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-4,4.5,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(8.4,-4,2.2,0,7);ctx.fill();
ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(12,-1);ctx.lineTo(22,2);ctx.lineTo(12,5);ctx.closePath();ctx.fill();
ctx.restore();
}
function active(){return state==='play'||shake>0||fxAlive(parts)||fxAlive(texts)||(state==='over'&&bird.y+bird.r<GROUND);}
let last=performance.now();
function loop(now){
requestAnimationFrame(loop);
if(document.hidden)return;
const dt=Math.min((now-last)/1000,.05);last=now;
if(state==='paused')return;
if(!active()){if(dirty){dirty=false;draw();}return;}
update(dt);
ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
draw();ctx.restore();
}
requestAnimationFrame(loop);
function setPaused(on){if(on&&state==='play'){state='paused';document.getElementById('pause').classList.remove('hidden');}else if(!on&&state==='paused'){state='play';document.getElementById('pause').classList.add('hidden');last=performance.now();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();setPaused(false);});
window.addEventListener('keydown',e=>{
if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();initAudio();
if(state==='ready'){document.getElementById('start').classList.add('hidden');startGame();flap();}
else if(state==='play')flap();
else if(state==='paused')setPaused(false);
else if(state==='over'&&!document.getElementById('over').classList.contains('hidden')){document.getElementById('over').classList.add('hidden');startGame();}}
if(e.key==='p'||e.key==='Escape'){if(state==='play')setPaused(true);else if(state==='paused')setPaused(false);}});
function onTap(){initAudio();if(state==='ready'){document.getElementById('start').classList.add('hidden');startGame();flap();}else if(state==='play'){flap();}}
window.addEventListener('pointerdown',e=>{if(e.target.closest('.ov'))return;onTap();});
document.getElementById('playBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();document.getElementById('start').classList.add('hidden');startGame();flap();});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();document.getElementById('over').classList.add('hidden');startGame();});
document.getElementById('over').addEventListener('pointerdown',e=>{e.stopPropagation();if(state==='over'&&!document.getElementById('over').classList.contains('hidden')){initAudio();document.getElementById('over').classList.add('hidden');startGame();}});
</script>
</body>
</html>
